# Baut bei jedem Versions-Tag (z. B. v1.2.0) die signierte Release-APK
# und veröffentlicht sie als GitHub Release – inklusive update.json mit Prüfsumme.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version aus gradle.properties lesen und mit Tag vergleichen
        id: version
        run: |
          CODE=$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::Tag v$TAG passt nicht zu VERSION_NAME=$NAME in gradle.properties"
            exit 1
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Keystore aus Secret wiederherstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt (siehe README)"
            exit 1
          fi
          # Leerzeichen/Zeilenumbrueche aus dem kopierten Wert entfernen, dann dekodieren.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "Keystore: $(wc -c < "$RUNNER_TEMP/release.jks") Bytes"

      - name: Unit-Tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Signierte Release-APK bauen
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: APK umbenennen, Signatur prüfen, update.json erzeugen
        run: |
          APK="lagebild-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -5
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$SHA  $APK" > "$APK.sha256"
          cat > update.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apk": "$APK",
            "sha256": "$SHA"
          }
          EOF
          cat update.json
          rm -f "$RUNNER_TEMP/release.jks"

      - name: GitHub Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: Lagebild ${{ steps.version.outputs.name }}
          body_path: CHANGELOG_RELEASE.md
          files: |
            lagebild-${{ steps.version.outputs.name }}.apk
            lagebild-${{ steps.version.outputs.name }}.apk.sha256
            update.json
